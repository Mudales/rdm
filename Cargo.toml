[workspace]
resolver = "3"
members = [
    "crates/rdm-core",
    "crates/rdm-media",
    "crates/rdm-manager",
    "crates/rdm-ipc",
    "crates/rdm-cli",
    "crates/rdm-host",
    "crates/rdm-gui",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Mudales/rdm"
authors = ["rdm contributors"]

# Versions are pinned here once and inherited by member crates with
# `dep.workspace = true`. Dependencies are added to this table in the phase
# that first uses them.
[workspace.dependencies]
rdm-core = { path = "crates/rdm-core" }
rdm-media = { path = "crates/rdm-media" }
rdm-manager = { path = "crates/rdm-manager" }
rdm-ipc = { path = "crates/rdm-ipc" }
rdm-host = { path = "crates/rdm-host" }

rdm-tests = { path = "tests" }

anyhow = "1.0.100"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
bytes = "1"
clap = { version = "4.5", features = ["derive"] }
dirs = "7"
fastrand = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
httpdate = "1"
jiff = "0.2"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
percent-encoding = "2"
# HTTP/1.1 only on purpose: HTTP/2 would multiplex every segment worker onto a
# single TCP connection and erase the multi-connection speed-up. No gzip
# features either: segments must be raw bytes at exact offsets.
# Bundled SQLite: no system library needed on any OS.
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "cookies", "socks", "system-proxy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1.47", default-features = false }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
# Positioned file writes (`FileExt::write_at` / `seek_write`) are safe std
# APIs, so the project needs no `unsafe` at all. A crate that genuinely needs
# it must opt out locally with a justification comment.
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# "No panics in library code": these are errors in CI via `-D warnings`.
# Test code is exempted in clippy.toml.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
