name: Release

# Push a tag like v0.1.0 to build installers for macOS (universal), Windows
# and Linux and attach them to a draft GitHub Release. Builds are unsigned
# unless the signing secrets described in docs/RELEASING.md are set.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  bundle:
    name: bundle (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            sidecar: universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Windows x64
            os: windows-latest
            sidecar: x86_64-pc-windows-msvc
            targets: x86_64-pc-windows-msvc
            args: ""
          - name: Linux x64
            # The oldest supported runner: AppImage/deb then run on older glibc.
            os: ubuntu-22.04
            sidecar: x86_64-unknown-linux-gnu
            targets: x86_64-unknown-linux-gnu
            args: ""
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.sidecar }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install the Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Build the rdm-host sidecar
        shell: bash
        run: scripts/build-host-sidecar.sh ${{ matrix.sidecar }}

      # Optional signing (see docs/RELEASING.md). Unset secrets arrive as
      # empty strings, and Tauri tries to sign whenever APPLE_CERTIFICATE
      # exists at all, so only export the variables that have values.
      - name: Enable macOS signing when configured
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then
              echo "$name=${!name}" >> "$GITHUB_ENV"
              echo "$name is set"
            fi
          done
          if [ -z "$APPLE_CERTIFICATE" ]; then echo "No signing certificate: building unsigned."; fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/rdm-gui
          tauriScript: tauri
          args: ${{ matrix.args }} --config tauri.bundle.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: rdm ${{ github.ref_name }}
          releaseBody: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md).

            These builds are **not code-signed**. macOS and Windows will warn on first launch; see [docs/RELEASING.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/RELEASING.md#installing-unsigned-builds). Verify downloads against `SHA256SUMS`.
          releaseDraft: true
          prerelease: false

  extras:
    name: extension + checksums
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Package the browser extension
        run: |
          cd extension
          zip -r "../rdm-extension-$TAG.zip" . -x 'test/*'

      - name: Upload the extension and SHA256SUMS
        run: |
          gh release upload "$TAG" "rdm-extension-$TAG.zip" --clobber
          mkdir assets
          gh release download "$TAG" --dir assets
          rm -f assets/SHA256SUMS
          (cd assets && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          gh release upload "$TAG" assets/SHA256SUMS --clobber
