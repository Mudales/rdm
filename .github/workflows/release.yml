name: Release

# Push a tag like v0.1.0 to build installers for macOS (universal), Windows
# and Linux and attach them to a draft GitHub Release, with the signed
# update packages and latest.json the in-app updater reads. The install
# scripts are then tested against the draft on all three systems. Builds are
# not OS code-signed unless the secrets in docs/RELEASING.md are set.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  bundle:
    name: bundle (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            sidecar: universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - name: Windows x64
            os: windows-latest
            sidecar: x86_64-pc-windows-msvc
            targets: x86_64-pc-windows-msvc
            args: ""
          - name: Linux x64
            # The oldest supported runner: AppImage/deb then run on older glibc.
            os: ubuntu-22.04
            sidecar: x86_64-unknown-linux-gnu
            targets: x86_64-unknown-linux-gnu
            args: ""
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.sidecar }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install the Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Build the rdm-host sidecar
        shell: bash
        run: scripts/build-host-sidecar.sh ${{ matrix.sidecar }}

      # Optional signing (see docs/RELEASING.md). Unset secrets arrive as
      # empty strings, and Tauri tries to sign whenever APPLE_CERTIFICATE
      # exists at all, so only export the variables that have values.
      - name: Enable macOS signing when configured
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then
              echo "$name=${!name}" >> "$GITHUB_ENV"
              echo "$name is set"
            fi
          done
          if [ -z "$APPLE_CERTIFICATE" ]; then echo "No signing certificate: building unsigned."; fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update packages (required: the updater refuses
          # anything that does not match the key in tauri.conf.json).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/rdm-gui
          tauriScript: tauri
          args: ${{ matrix.args }} --config tauri.bundle.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: rdm ${{ github.ref_name }}
          releaseBody: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md).

            These builds are **not code-signed**. macOS and Windows will warn on first launch; see [docs/RELEASING.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/RELEASING.md#installing-unsigned-builds). Verify downloads against `SHA256SUMS`.
          releaseDraft: true
          prerelease: false
          # Windows updates use the per-user NSIS installer, like install.ps1.
          updaterJsonPreferNsis: true

  extras:
    name: extension + checksums
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Package the browser extension
        run: |
          cd extension
          zip -r "../rdm-extension-$TAG.zip" . -x 'test/*'

      - name: Upload the extension and SHA256SUMS
        run: |
          gh release upload "$TAG" "rdm-extension-$TAG.zip" --clobber
          mkdir assets
          gh release download "$TAG" --dir assets
          rm -f assets/SHA256SUMS
          (cd assets && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          gh release upload "$TAG" assets/SHA256SUMS --clobber

  install-test:
    name: install scripts (${{ matrix.os }})
    needs: extras
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Download the draft's packages
        shell: bash
        run: gh release download "$TAG" --dir dist --pattern 'rdm_*' --pattern SHA256SUMS

      - name: macOS
        if: runner.os == 'macOS'
        run: |
          apps="$RUNNER_TEMP/apps"
          scripts/install.sh --from dist --prefix "$apps"
          "$apps/rdm.app/Contents/MacOS/rdm-host" --version | grep -F "${TAG#v}"
          scripts/install.sh --uninstall --prefix "$apps"
          test ! -e "$apps/rdm.app"

      - name: Linux (.deb)
        if: runner.os == 'Linux'
        run: |
          scripts/install.sh --from dist
          rdm-host --version | grep -F "${TAG#v}"
          dpkg -s rdm | grep -F "Version: ${TAG#v}"
          scripts/install.sh --uninstall
          if dpkg-query -W -f='${Status}' rdm 2>/dev/null | grep -q 'ok installed'; then exit 1; fi

      - name: Linux (AppImage)
        if: runner.os == 'Linux'
        run: |
          scripts/install.sh --from dist --appimage
          host="$HOME/.local/share/dev.rdm.desktop/browser-host"
          "$host/rdm-host" --version | grep -F "${TAG#v}"
          test "$(cat "$host/rdm-app-path")" = "$HOME/.local/bin/rdm.AppImage"
          scripts/install.sh --uninstall
          test ! -e "$HOME/.local/bin/rdm.AppImage"

      - name: Windows (PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\scripts\install.ps1 -From dist
          $hostExe = Join-Path $env:LOCALAPPDATA 'rdm\rdm-host.exe'
          $out = & $hostExe --version
          if ($out -notmatch [regex]::Escape($env:TAG.TrimStart('v'))) { throw "unexpected version: $out" }
          .\scripts\install.ps1 -Uninstall
          if (Test-Path $hostExe) { throw 'rdm-host.exe is still there after uninstalling' }
