name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Tauri, plus ffmpeg for rdm-media's merge tests.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev ffmpeg

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features --locked

  extension:
    name: extension tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Unit tests (lib/detect.js, lib/capture.js)
        run: node --test extension/test/*.test.mjs
      - name: Scripts parse
        run: for f in extension/*.js extension/lib/*.js; do node --input-type=module --check < "$f" || exit 1; done
      - name: Manifest is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json', 'utf8'))"

  install-scripts:
    name: install scripts (lint)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck install.sh
        if: runner.os == 'Linux'
        run: shellcheck --shell=sh scripts/install.sh
      - name: Install scripts are plain ASCII
        if: runner.os == 'Linux'
        # macOS runs `sh` as bash 3.2, which in UTF-8 locales reads a
        # multibyte character right after `$NAME` as part of the name
        # ("VERSION…: unbound variable"); Windows PowerShell 5.1 misreads
        # UTF-8 without a BOM.
        run: "! LC_ALL=C grep -n -P '[^\\x00-\\x7F]' scripts/install.sh scripts/install.ps1"
      - name: Run install.sh under a C locale (bash as sh)
        if: runner.os == 'Linux'
        run: LC_ALL=C bash --posix scripts/install.sh --help >/dev/null
      - name: Parse install.ps1 (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$pwd\scripts\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | Format-List; exit 1 }

  guards:
    name: dependency guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: No OpenSSL; rdm-core stays UI/ffmpeg-free
        run: ./scripts/check-deps.sh
