[package]
name = "rdm-gui"
description = "Desktop GUI for rdm (Tauri v2)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "rdm-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
rdm-core.workspace = true
rdm-host.workspace = true
rdm-ipc.workspace = true
rdm-manager.workspace = true
anyhow.workspace = true
serde.workspace = true
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2.4"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
